<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar" id="navbar">
            <span class="navbar-brand mb-0 h1 w-100 text-center" id="navbar-text">Team Profile</span>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="row justify-content-center" id="team-cards">
                <!--Team Cards-->
                
<div class="col-4 mt-4">
    <div class="card h-100">
        <div class="card-header">
            <h3>Sample Manager</h3>
            <h4>Manager</h4>
        </div>
        <div class="card-body">
            <p class="id">ID: 1</p>
            <p class="email">Email: <a href="mailto:manager%40example.com">manager@example.com</a></p>
            <p class="office">Office Number: 101</p>
        </div>
    </div>
</div>

<div class="col-4 mt-4">
    <div class="card h-100">
        <div class="card-header">
            <h3>Sample Engineer</h3>
            <h4>Engineer</h4>
        </div>
        <div class="card-body">
            <p class="id">ID: 2</p>
            <p class="email">Email: <a href="mailto:engineer%40example.com">engineer@example.com</a></p>
            <p class="github">Github: <a href="https://github.com/example-engineer">example-engineer</a></p>
        </div>
    </div>
</div>

<div class="col-4 mt-4">
    <div class="card h-100">
        <div class="card-header">
            <h3>Sample Intern</h3>
            <h4>Intern</h4>
        </div>
        <div class="card-body">
            <p class="id">ID: 3</p>
            <p class="email">Email: <a href="mailto:intern%40example.com">intern@example.com</a></p>
            <p class="school">School: Example University</p>
        </div>
    </div>
</div>

            </div>
        </div>
    </main>
</body>
</html>
